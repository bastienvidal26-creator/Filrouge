<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="FilRouge — encyclopédie et carnet de suivi manga & anime">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>FilRouge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a library rail on the left (tab bar on phones), a shelf of black-and-white screentone covers, fiches open as full pages.
   Single permanent dark theme, monochrome. Colour is reserved for signals: publication dots, the trend flame, platform marks. */
:root{
  color-scheme:dark;
  --paper:#000000; --surface:#0f0f10; --surface-2:#1c1c1e; --ink:#f5f5f7; --muted:#8e8e93; --line:#2c2c2e; --line-2:#3a3a3c;
  --riso:#f5f5f7; --riso-soft:#1c1c1e; --on-riso:#000000; --blue:#d1d1d6; --blue-soft:#1c1c1e;
  --ok:#d1d1d6; --ok-soft:#1c1c1e; --warn:#d1d1d6; --warn-soft:#1c1c1e; --stop:#8e8e93; --drop:#8e8e93;
  --teal:#d1d1d6; --teal-soft:#1c1c1e; --violet:#d1d1d6; --violet-soft:#1c1c1e;
  --pub-on:#34c759; --pub-pause:#ff9f0a; --pub-done:#8e8e93; --pub-stop:#ff453a;
  --fire-1:#fff1b8; --fire-2:#ffb347; --fire-3:#ff6a2b; --fire-4:#e8361c;
  --st-current:#f5f5f7; --st-plan:#a1a1a6; --st-done:#636366; --st-hold:#48484a; --st-drop:#3a3a3c;
  --shadow:0 1px 2px rgb(0 0 0 / .5),0 8px 24px rgb(0 0 0 / .4);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Hiragino Sans","Helvetica Neue",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Hiragino Sans","Helvetica Neue",system-ui,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Hiragino Sans","Helvetica Neue",system-ui,sans-serif;
  --r:12px;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--riso);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--blue)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font:500 13px/1.3 var(--f-body);letter-spacing:-.005em;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── shell ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:-.025em}
.brand .mark{width:30px;height:30px;flex:none;display:block}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav[aria-current="page"] svg{color:var(--riso)}
.nav .count{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.sync{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--stop);flex:none}
.sync.on i{background:var(--ok)}

.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgb(0 0 0 / .78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;gap:12px;align-items:center;padding-block:12px;padding-inline:28px;max-width:1280px}
.top .brand{display:none;padding:0}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;outline:none}
.search input:focus{border-color:var(--riso);box-shadow:0 0 0 3px var(--riso-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--riso);color:var(--on-riso);border-color:var(--riso)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn.danger{color:var(--drop)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn svg{width:18px;height:18px}

main{padding-block:28px 120px;padding-inline:28px;max-width:1280px;width:100%}
.view-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:22px}
.view-head h1{font:700 clamp(30px,4.4vw,40px)/1.1 var(--f-display);letter-spacing:-.028em}
.view-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.section{margin-top:36px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-head h2{font:700 21px/1.2 var(--f-display);letter-spacing:-.022em}

/* ── covers ── */
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 7px 7px 3px;overflow:hidden;background:var(--c1);color:var(--c2);container-type:inline-size;box-shadow:0 1px 2px rgb(0 0 0 / .18),0 8px 18px -8px rgb(0 0 0 / .35);isolation:isolate}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:5cqw;background:linear-gradient(90deg,rgb(0 0 0 / .28),rgb(255 255 255 / .08) 60%,transparent);z-index:3}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.cv-pat{position:absolute;inset:0;z-index:0}
.p-dots{background:radial-gradient(circle,var(--c3) 34%,transparent 37%) 0 0/7cqw 7cqw;-webkit-mask-image:linear-gradient(160deg,#000 15%,transparent 78%);mask-image:linear-gradient(160deg,#000 15%,transparent 78%)}
.p-speed{background:repeating-conic-gradient(from 0deg at 64% 36%,var(--c3) 0deg 1.4deg,transparent 1.4deg 6.5deg);-webkit-mask-image:radial-gradient(circle at 64% 36%,transparent 16%,#000 62%);mask-image:radial-gradient(circle at 64% 36%,transparent 16%,#000 62%)}
.p-hatch{background:repeating-linear-gradient(135deg,var(--c3) 0 1.4cqw,transparent 1.4cqw 5cqw);-webkit-mask-image:linear-gradient(to bottom,transparent 5%,#000 70%);mask-image:linear-gradient(to bottom,transparent 5%,#000 70%)}
.p-rings{background:repeating-radial-gradient(circle at 26% 74%,var(--c3) 0 1.3cqw,transparent 1.3cqw 6cqw)}
.p-sun{background:radial-gradient(circle at 62% 36%,var(--c3) 0 30cqw,transparent 30.6cqw)}
.p-grid{background:linear-gradient(var(--c3) .7cqw,transparent .7cqw) 0 0/100% 9cqw,linear-gradient(90deg,var(--c3) .7cqw,transparent .7cqw) 0 0/9cqw 100%;-webkit-mask-image:linear-gradient(to top,#000,transparent 75%);mask-image:linear-gradient(to top,#000,transparent 75%)}
.p-split{background:linear-gradient(112deg,transparent 56%,var(--c3) 56%)}
.cv-jp{position:absolute;z-index:1;top:7cqw;right:8cqw;writing-mode:vertical-rl;font:800 var(--jfs,18cqw)/1.02 var(--f-display);letter-spacing:.02em;max-height:70%;overflow:hidden;color:var(--c2)}
.cv-foot{position:absolute;z-index:1;left:9cqw;right:9cqw;bottom:8cqw}
.cv-t{font:800 9.5cqw/1.04 var(--f-display);text-transform:uppercase;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cv-a{font:600 5.2cqw/1.2 var(--f-body);margin-top:2.5cqw;opacity:.85;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cv-b{position:absolute;z-index:4;top:6cqw;left:8cqw;font:700 5cqw/1 var(--f-body);letter-spacing:.04em;padding:2cqw 2.6cqw;background:var(--c2);color:var(--c1);border-radius:1.5cqw;font-variant-numeric:tabular-nums}

/* ── cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:26px 20px}
.card{display:flex;flex-direction:column;gap:10px;border:0;background:none;padding:0;text-align:left;min-width:0;position:relative}
.card .cover{transition:transform .2s ease,box-shadow .2s ease}
.card:hover .cover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 2px 3px rgb(0 0 0 / .18),0 16px 26px -10px rgb(0 0 0 / .45)}
.card-t{font-weight:700;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-m{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .flag{position:absolute;z-index:5;top:8px;right:8px}
.card-prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.card-prog i{display:block;height:100%;background:var(--riso)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,164px);gap:20px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.shelf>*{scroll-snap-align:start}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:500 12px/1 var(--f-body);white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-current{background:var(--ink);color:#000}
.s-plan{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.s-done{background:#3a3a3c;color:var(--ink)}
.s-hold{background:var(--surface-2);color:var(--muted)}
.s-drop{background:var(--surface-2);color:#636366;text-decoration:line-through}
.flag .pill{box-shadow:0 1px 6px rgb(0 0 0 / .6)}
.flag .pill.s-plan,.flag .pill.s-hold,.flag .pill.s-drop{background:rgb(0 0 0 / .72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ── toolbar / filters ── */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.seg button .n{font:500 11.5px var(--f-mono);margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 32px 0 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;font-size:14px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.filters{display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:20px}
.filters-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.filters-row .label{min-width:84px}
.fmore{display:grid;gap:12px}
.ftoggle{justify-self:start}
.seg button svg{width:18px;height:18px;vertical-align:-4px}
.spacer{flex:1}
.result-count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--riso-soft);margin-bottom:18px}
.banner b{font-weight:700}

/* ── table view ── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:14px}
th{position:sticky;top:0;text-align:left;font:600 13px var(--f-body);letter-spacing:-.005em;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;font-variant-numeric:tabular-nums}
th button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
th button[data-on="1"]{color:var(--ink)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.tcell{display:flex;gap:12px;align-items:center;min-width:0}
.tcell .cover{width:36px;flex:none;border-radius:2px 4px 4px 2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── my list rows ── */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto auto;gap:18px;align-items:center;padding:12px 16px 12px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.row .cover{width:56px;border-radius:2px 5px 5px 2px;cursor:pointer}
.row-t{font-weight:700;font-size:15.5px;line-height:1.3;border:0;background:none;padding:0;text-align:left}
.row-t:hover{color:var(--riso)}
.row-m{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px;max-width:360px}
.bar i{display:block;height:100%;background:var(--riso);border-radius:3px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:34px;height:36px;font-size:18px;line-height:1;color:var(--muted)}
.stepper button:hover{background:var(--surface-2);color:var(--ink)}
.stepper button.plus{color:var(--riso)}
.stepper input{width:64px;height:36px;border:0;border-inline:1px solid var(--line);background:none;text-align:center;font:500 14px var(--f-mono);outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.stepper input::-webkit-inner-spin-button{display:none}
.stepper-l{font:500 13px var(--f-body);letter-spacing:-.005em;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.score-sel{width:84px}
.empty{display:grid;place-items:center;text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty h3{font:700 21px/1.2 var(--f-display);letter-spacing:-.02em;margin-bottom:8px}
.empty p{color:var(--muted);max-width:46ch;margin:0 auto 18px}
.empty .jp{font:700 40px/1 var(--f-display);color:var(--riso);margin-bottom:12px}

/* ── fiche ── */
.back{margin-bottom:18px}
.hero{display:grid;grid-template-columns:minmax(150px,250px) minmax(0,1fr);gap:36px;align-items:start}
.hero-cover{display:flex;flex-direction:column;gap:10px}
.hero h1{font:700 clamp(28px,4.6vw,44px)/1.08 var(--f-display);letter-spacing:-.03em;margin-top:10px}
.hero .orig{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:8px;color:var(--muted)}
.hero .orig .jp{font:600 17px/1.2 var(--f-display);color:var(--ink)}
.kicker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:22px}
.fact{background:var(--surface);padding:12px 14px;min-width:0}
.fact b{display:block;font-weight:700;font-size:15px;margin-top:4px;overflow-wrap:anywhere}
.people{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px}
.person{border:0;background:none;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:2px}
.person:hover{text-decoration-color:var(--riso)}
.tracker{margin-top:24px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:18px}
.tracker-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tracker-head h2{font:700 16px var(--f-body)}
.st-btns{display:flex;flex-wrap:wrap;gap:6px}
.st-btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.st-btn i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.st-btn[aria-pressed="true"]{border-color:transparent}
.st-btn[aria-pressed="true"].s-current i,.st-btn[aria-pressed="true"].s-plan i,.st-btn[aria-pressed="true"].s-done i,.st-btn[aria-pressed="true"].s-hold i,.st-btn[aria-pressed="true"].s-drop i{background:currentColor}
.st-btn:not([aria-pressed="true"]){background:var(--surface);color:var(--ink)}
.tr-row{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:end}
.scores{display:flex;gap:4px;flex-wrap:wrap}
.scores button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.scores button[aria-pressed="true"]{background:var(--riso);border-color:var(--riso);color:var(--on-riso)}
.scores button.in{background:var(--riso-soft);border-color:transparent}
.tr-dates{display:flex;gap:14px;flex-wrap:wrap}
.tr-dates label{display:grid;gap:4px}
.input{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:none;max-width:100%}
.input:focus,textarea.input:focus{border-color:var(--riso);box-shadow:0 0 0 3px var(--riso-soft)}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;width:100%;line-height:1.5}

.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:10;display:flex;gap:4px;overflow-x:auto;margin:34px 0 0;padding:8px 0;background:var(--paper);border-bottom:1px solid var(--line)}
.subnav button{border:0;background:none;height:34px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
.subnav button:hover{background:var(--surface-2);color:var(--ink)}
.fsec{padding-top:30px;scroll-margin-top:140px}
.fsec>h2{font:700 22px/1.2 var(--f-display);letter-spacing:-.022em;margin-bottom:14px;display:flex;align-items:baseline;gap:12px}
.fsec>h2 small{font:500 15px var(--f-body);letter-spacing:-.01em;color:var(--muted);font-variant-numeric:tabular-nums}
.prose{max-width:68ch;font-size:16px;line-height:1.7}
.prose p{margin:0 0 12px}
.genres{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dl{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);max-width:820px}
.dl>div{padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.dl>div:nth-last-child(-n+2){border-bottom:0}
.dl .k{color:var(--muted);font-size:13.5px;background:var(--surface-2)}
.prix{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;max-width:68ch}
.prix li{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.prix li::before{content:"賞";font:700 14px var(--f-display);color:var(--riso);flex:none}
.note-ed{font-size:12.5px;color:var(--muted);margin-top:12px}
.reviews{display:grid;gap:12px;max-width:820px}
.rv-summary{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rv-big{font:700 38px/1 var(--f-display);letter-spacing:-.03em}
.rv-big small{font:500 14px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rv-hist{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;align-items:end;height:44px;width:220px;max-width:100%}
.rv-hist i{display:block;background:var(--riso);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.rv-hist-l{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:220px;max-width:100%;font:500 10px var(--f-mono);color:var(--muted);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
.rv{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rv-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.rv-h img{width:26px;height:26px;border-radius:50%}
.rv-h .who{font-weight:700}
.rv-h .sc{margin-left:auto;font:500 13px var(--f-mono);background:var(--riso-soft);color:var(--riso);padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.rv p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.rv-form{display:grid;gap:10px;padding:16px;border-radius:var(--r);border:1px dashed var(--line)}
.links{display:flex;gap:10px;flex-wrap:wrap}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:20px;max-width:820px}

/* ── stats ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font:700 30px/1.1 var(--f-display);letter-spacing:-.03em;margin-top:6px}
.kpi span{font-size:13px;color:var(--muted)}
.panel{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.hbar .t{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--riso)}
.vbars{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:150px;margin-top:14px;border-bottom:1px solid var(--line)}
.vbars div{display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:4px}
.vbars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--riso);min-height:0}
.vbars span{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.vlabels{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;font:500 11px var(--f-mono);color:var(--muted);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
.stackbar i{display:block;height:100%}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}

/* ── form ── */
.form{display:grid;gap:18px;max-width:860px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field .input,.field .select{width:100%}
.staff-row{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 36px;gap:8px}
.claude-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--blue-soft)}
.claude-box p{margin:0;flex:1;min-width:220px;font-size:14px}
.pub{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1.2 var(--f-body);color:var(--muted);white-space:nowrap}
.pub i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px color-mix(in srgb,var(--surface) 70%,transparent)}
.pubpill .pub{color:var(--ink)}
.chip .pub{color:inherit;font-size:13px}
.card-hint{font-size:12px;color:var(--riso);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1040px}
.char{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:start;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.char-av{position:relative;width:68px;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:50%;overflow:hidden;background:var(--c1);color:var(--c2);container-type:inline-size;isolation:isolate}
.char-av .ini{position:absolute;inset:0;display:grid;place-items:center;font:600 34cqw/1 var(--f-display);z-index:1;letter-spacing:-.02em}
.char-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.char-av .cam{position:absolute;z-index:3;right:0;bottom:0;width:30cqw;height:30cqw;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.char-av:hover .cam,.char-av:focus-visible .cam{opacity:1}
.char-av .cam svg{width:62%;height:62%}
.char-n{font-weight:700;line-height:1.3}
.char p{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45}
.role{display:inline-block;font:600 12.5px/1 var(--f-body);letter-spacing:-.005em;margin-top:5px;font-variant-numeric:tabular-nums}
.role-P{color:var(--ink)}.role-A{color:#c7c7cc;font-style:italic}.role-M{color:#c7c7cc}.role-S{color:var(--muted)}
.char-links{display:flex;gap:10px;margin-top:6px;font-size:12.5px}
.char-links a,.char-links button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.char-links a:hover,.char-links button:hover{color:var(--ink)}
.sugg{margin-top:34px}
.sugg-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sugg-head h2{font:700 18px/1.2 var(--f-body)}
.sg{display:flex;flex-direction:column;gap:10px;min-width:0}
.sg .btn{width:100%;margin-top:4px}
.sg.sk .cover{background:var(--surface-2);box-shadow:none;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.cw{position:relative;isolation:isolate}
.fl{display:inline-block;vertical-align:-2px;margin-right:5px}
.fl svg{display:block;width:var(--hs);height:var(--hs)}
.fl[data-heat="1"]{--hs:11px}.fl[data-heat="2"]{--hs:12px}.fl[data-heat="3"]{--hs:14px}.fl[data-heat="4"]{--hs:15px}.fl[data-heat="5"]{--hs:17px}
.cw[data-heat="2"] .cover{box-shadow:0 1px 2px rgb(0 0 0 / .5),0 0 8px 0 rgb(255 120 40 / .12)}
.cw[data-heat="3"] .cover{box-shadow:0 1px 2px rgb(0 0 0 / .5),0 0 10px 0 rgb(255 120 40 / .18)}
.cw[data-heat="4"] .cover{box-shadow:0 1px 2px rgb(0 0 0 / .5),0 0 14px 1px rgb(255 110 40 / .22)}
.cw[data-heat="5"] .cover{box-shadow:0 0 0 1px rgb(255 170 80 / .45),0 0 18px 2px rgb(255 100 30 / .28)}
.fire{position:absolute;z-index:-1;pointer-events:none;left:-6%;right:-6%;bottom:0;opacity:.85}
.fire svg{display:block;width:100%;height:100%}
.fire.f4{height:30%}.fire.f5{height:56%;left:-8%;right:-8%}
.fire .t{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.5s ease-in-out infinite alternate}
.fire .t:nth-child(2n){animation-duration:1.1s;animation-delay:-.3s}.fire .t:nth-child(3n){animation-duration:1.8s;animation-delay:-.7s}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}45%{transform:scale(.93,1.1) skewX(3deg)}100%{transform:scale(1.05,.9) skewX(-3deg)}}
.fire-shelf{padding:44px 16px 26px;margin:-44px -16px -8px}
.trend{margin-top:16px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,rgb(255 110 40 / .07),transparent 70%),var(--surface)}
.trend-h{display:flex;align-items:center;gap:10px}
.trend-h svg{width:22px;height:22px}
.trend-h b{font-weight:700;font-size:16px}
.meter{display:inline-flex;gap:3px;margin-left:auto}
.meter i{width:16px;height:5px;border-radius:3px;background:var(--line-2)}
.meter i.on{background:linear-gradient(90deg,var(--fire-2),var(--fire-3))}
.trend ul{margin:10px 0 0;padding-left:18px;font-size:14.5px;color:#d1d1d6;display:grid;gap:4px}
.provs{display:flex;flex-wrap:wrap;gap:8px}
.prov{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px 6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.prov:hover{border-color:var(--line-2);background:var(--surface-2)}
.prov i,.prov-mini i{width:10px;height:10px;border-radius:3px;flex:none}
.prov b{font-weight:600}
.prov span{font-size:12.5px;color:var(--muted)}
.relstream{margin:14px 0 0;font-size:14px;color:#d1d1d6;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.prov-mini{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;background:var(--surface-2);font-weight:600;font-size:13px}
.press{display:grid;gap:10px;max-width:820px}
.pr{padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.pr-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pr-h b{font-weight:700}
.pr-h .sc{font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.pr-h .muted{font-size:13px}
.pr p{margin:0 0 8px;color:#d1d1d6;line-height:1.55}
.pr a{font-size:13.5px;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.pr a svg{width:14px;height:14px}
.rscores{display:flex;flex-wrap:wrap;gap:10px}
.rs{display:grid;gap:2px;min-width:118px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.rs-n{font:700 22px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rs-s{font-size:13px;font-weight:600}
.rs small{font-size:12px;color:var(--muted)}
.awards{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-width:820px}
.awards li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.aw-y{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.aw-r{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.aw-r.won{background:var(--ink);color:#000}
.aw-r.nom{box-shadow:inset 0 0 0 1px var(--line-2);color:#d1d1d6}
.official{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px}
.official .muted{font-size:12.5px;max-width:52ch}
.cover-tools{display:grid;gap:6px}
.set{max-width:720px;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:grid;gap:14px;margin-bottom:16px}
.set h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.02em}
.set p{margin:0}
.set-btns{display:flex;gap:8px;flex-wrap:wrap}
.set-form{display:grid;gap:10px}
.set-state{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.set-state i{width:9px;height:9px;border-radius:50%;background:#636366}
.set-state.ok{color:var(--ink)}.set-state.ok i{background:var(--pub-on)}
.switch{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:#f5f5f7;grid-row:span 2}
.switch span{font-weight:600}
.switch small{color:var(--muted);font-size:12.5px}
.howto summary{cursor:pointer;font-weight:600;padding:6px 0}
.howto ol{margin:8px 0 12px;padding-left:20px;display:grid;gap:6px;color:#d1d1d6;font-size:14.5px}
.howto a{color:var(--ink)}
.howto form{display:grid;gap:10px}
.srcs{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-width:68ch;font-size:13.5px}
.srcs a{color:#d1d1d6}
.top-gear{display:none}
.top-gear svg{width:21px;height:21px}
.reqs{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.req{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.req i{width:8px;height:8px;border-radius:50%;background:#636366;flex:none}
.req.pending i{background:var(--pub-pause)}.req.done i{background:var(--pub-on)}.req.notfound i{background:var(--pub-stop)}
.req .rq{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.req small{color:var(--muted);font-weight:500}
.req .rs-l{font-size:12.5px;color:var(--muted)}
.relc{display:grid;gap:6px;align-content:start}
.rel-k{font:600 11.5px/1.2 var(--f-body);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.relx{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:820px}
.relx li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.relx .rel-k{min-width:110px}
.relx-t{flex:1;min-width:150px;display:grid;gap:2px}.relx-t small{color:var(--muted);font-size:12.5px}
.seasons{list-style:none;padding:0;margin:0;display:grid;gap:0;max-width:820px;border-top:1px solid var(--line)}
.seasons li{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.seasons li span{color:#d1d1d6;font-variant-numeric:tabular-nums}
.seasons li small{grid-column:2;color:var(--muted);font-size:13px}
@media (max-width:560px){.seasons li{grid-template-columns:1fr}.seasons li small{grid-column:1}}
.reqstate{display:grid;gap:8px;justify-items:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin:4px 0 10px}
.reqstate p{margin:0;font-size:14px}
.reqerr{color:#ff9f0a}
.quickadd.ask{align-items:flex-start}
.quickadd.ask>div{flex:1;min-width:220px;display:grid;gap:10px}
.cover-tools .btn{width:100%}
.cover-hint{margin:2px 0 0;font-size:12px;line-height:1.4;color:var(--muted)}
body.dropping .hero-cover .cover,body.dropping .cover-pick .cover{outline:3px dashed var(--riso);outline-offset:4px}
.quickadd{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:28px;padding:16px 18px;border-radius:var(--r);border:1px dashed var(--line);background:var(--surface)}
.quickadd p{margin:0;flex:1;min-width:220px;font-size:14.5px}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover-pick{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cover-pick .cover{width:90px}

/* ── toast & tabbar ── */
.toast{border:1px solid var(--line);position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:60;display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:12px;background:#1c1c1e;color:var(--ink);box-shadow:0 10px 30px rgb(0 0 0 / .6);font-size:14px;max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:#fff;text-decoration:underline;font-weight:700;padding:0}
.tabbar{display:none}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .top .brand{display:flex}
  .top-in{padding-inline:16px}
  main{padding-inline:16px;padding-block:20px 120px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgb(18 18 20 / .86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:var(--muted);border-radius:10px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--riso)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top-add .t{display:none}
  .top-gear{display:inline-grid}
  .subnav{top:calc(env(safe-area-inset-top,0px) + 69px)}
}
@media (max-width:720px){
  .hero{grid-template-columns:112px minmax(0,1fr);gap:16px 18px}
  .hero-main{display:contents}
  .hero-title{grid-column:2;grid-row:1;align-self:center}
  .hero-rest{grid-column:1 / -1}
  .hero h1{font-size:26px}
  .scores{gap:3px}.scores button{width:28px;height:30px}
  .hero-cover .btn{white-space:normal;height:auto;min-height:32px;padding:6px 8px;font-size:12px;text-align:center}
  .cover-hint{display:none}
  .row{grid-template-columns:52px minmax(0,1fr);gap:10px 14px}
  .row .cover{width:52px;grid-row:span 2}
  .row-ctrl{grid-column:2;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:22px 14px}
  .dl{grid-template-columns:minmax(0,1fr)}
  .dl .k{border-bottom:0;padding-bottom:2px}
  .dl>div:nth-last-child(2){border-bottom:0}
  .staff-row{grid-template-columns:minmax(0,1fr) 36px}
  .staff-row .select{grid-column:1 / -1}
}
@media (min-width:721px){.row-ctrl{display:contents}}
@media (max-width:480px){.top .brand b{display:none}.top .brand .mark{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.fire .t,.sg.sk .cover{animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Navigation">
    <div class="brand"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><use href="#logo-filrouge"></use></svg><b>FilRouge</b></div>
    <nav id="railnav"></nav>
    <div class="rail-foot">
      <button class="btn primary" data-act="add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une œuvre</button>
      <div class="sync" id="sync"><i></i><span>Enregistré sur cet appareil</span></div>
    </div>
  </aside>
  <div class="col">
    <header class="top">
      <div class="top-in">
        <div class="brand"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><use href="#logo-filrouge"></use></svg><b>FilRouge</b></div>

{id:"20cb",t:"manga",ti:"20th Century Boys",ro:"Nijusseiki Shōnen",jp:"20世紀少年",y:1999,e:2006,st:"terminé",d:"Seinen",g:["Science-fiction","Thriller","Mystère"],

{id:"jjk",t:"manga",ti:"Jujutsu Kaisen",ro:"Jujutsu Kaisen",jp:"呪術廻戦",y:2018,e:2024,st:"terminé",d:"Shōnen",g:["Action","Surnaturel","Horreur"],

/* ───────── CATALOG ───────── */
const SORTS = {
  title:{ l:"Titre", f:(a, b) => a.ti.localeCompare(b.ti, "fr", { sensitivity:"base" }) },
  year:{ l:"Année", f:(a, b) => (a.y || 0) - (b.y || 0) },
  size:{ l:"Tomes / épisodes", f:(a, b) => sz(a) - sz(b) },
  avg:{ l:"Moyenne lecteurs", f:(a, b) => (avgFor(a.id) ?? -1) - (avgFor(b.id) ?? -1) },
  mine:{ l:"Ma note", f:(a, b) => ((S.entries[a.id] || {}).score || 0) - ((S.entries[b.id] || {}).score || 0) },
  status:{ l:"Mon statut", f:(a, b) => stRank(a) - stRank(b) },
  creator:{ l:"Auteur / studio", f:(a, b) => (creators(a)[0] || "").localeCompare(creators(b)[0] || "", "fr") },
  type:{ l:"Type", f:(a, b) => typeLabel(a).localeCompare(typeLabel(b)) },
  pub:{ l:"Statut de parution", f:(a, b) => PUB_ORDER.indexOf(a.st) - PUB_ORDER.indexOf(b.st) },
  trend:{ l:"Tendance", f:(a, b) => ((trendOf(a.id) || {}).s || heat(a.id) * 20) - ((trendOf(b.id) || {}).s || heat(b.id) * 20) }
};
function sz(w) { return w.t === "manga" ? (w.v || (w.ch ? w.ch / 9 : 0)) : (w.eps || 0); }
function stRank(w) { const e = S.entries[w.id]; return e ? STATUSES.indexOf(e.status) : 9; }
function matchQ(w, q) {
  if (!q) return true;
  const hay = norm([w.ti, w.ro, w.jp, w.studio, w.mag, w.ed, w.fr, ...(w.staff || []).map(s => s[1]), ...(w.g || []), ...(w.ps || []).map(p => p[0])].join(" | "));
  return norm(q).split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}
function charHit(w, q) {
  if (!q) return "";
  const toks = norm(q).split(/\s+/).filter(Boolean);
  const inTitle = toks.every(t => norm([w.ti, w.ro, w.jp].join(" ")).includes(t));
  if (inTitle) return "";
  const p = (w.ps || []).find(p => toks.every(t => norm(p[0]).includes(t)));
  return p ? `Personnage : ${p[0]}` : "";
}
function catalogList() {
  const c = state.cat;
  let list = allWorks().filter(w =>
    kindIs(w, c.type) &&
    (!c.demo || w.d === c.demo) &&
    (!c.genre || (w.g || []).includes(c.genre)) &&
    (!c.pst || w.st === c.pst) &&
    (!c.mine || (c.mine === "in" ? !!S.entries[w.id] : !S.entries[w.id])) &&
    (!c.person || (w.staff || []).some(s => s[1] === c.person) || w.studio === c.person) &&
    matchQ(w, c.q));
  const s = SORTS[prefs.catSort] || SORTS.title;
  list.sort((a, b) => s.f(a, b) * prefs.catDir || SORTS.title.f(a, b));
  return list;
}

  ${!list.length ? emptyBox("無", c.q ? `« ${esc(c.q)} » n’est pas encore dans l’encyclopédie` : "Aucune œuvre ne correspond", c.q ? "Demande-la à Claude : il la trouve sur le web et ajoute sa fiche complète (équipe, parution, synopsis, personnages), en général dans les 2 heures." : "Élargis les filtres pour retrouver des œuvres.", c.q ? quickBtns(c.q, true) : "")
    : (prefs.layout === "table" ? tableHTML(list) : `<div class="grid">${list.map(w => cardHTML(w, { hint:charHit(w, c.q) })).join("")}</div>`)}
  ${c.q ? `<div id="sugg">${suggHTML()}</div>` : ""}
  ${list.length && c.q ? `<div class="quickadd"><p><b>Tu ne trouves pas ton œuvre ?</b> Demande-la à Claude ou crée sa fiche toi-même.</p>${quickBtns(c.q)}</div>` : ""}`;
}
/* Claude: recherche au-delà de l’encyclopédie intégrée */
let suggT, suggSeq = 0;
function suggHTML() {
  const q = state.cat.q.trim();
  if (q.length < 3) return "";
  const mine = S.requests.filter(r => norm(r.q) === norm(q));
  return `<section class="sugg"><div class="quickadd ask"><div><p><b>Introuvable ici ? Claude la cherche pour toi.</b> Titre, auteur ou personnage : Claude trouve l’œuvre sur le web et ajoute sa fiche complète, en général dans les 2 heures.</p>${mine.length ? requestsHTML(3) : ""}</div>${quickBtns(q)}</div></section>`;
}
function paintSugg() { const el = document.getElementById("sugg"); if (el) el.innerHTML = suggHTML(); }
async function suggest(q) {
  return;
  const seq = ++suggSeq;
  state.sugg = { q, loading:true, items:[] }; paintSugg();
  const prompt = `Moteur de recherche d’une encyclopédie de manga et d’animation japonaise. Requête : « ${q} ». Elle peut être un titre (même partiel ou mal orthographié), un auteur, un studio ou un nom de personnage.
Donne jusqu’à 6 œuvres réellement existantes qui correspondent, les plus connues d’abord. Une adaptation animée et le manga d’origine sont deux résultats distincts quand les deux sont pertinents.
Réponds uniquement en JSON : {"results":[{"ti":"titre français usuel","jp":"titre japonais","t":"manga" ou "anime","y":année de début,"by":"auteur pour un manga, studio pour un anime","st":"en cours" | "en pause" | "terminé" | "annulé","why":"pourquoi ça correspond, ex. Personnage : Monkey D. Luffy, ou Auteur : Naoki Urasawa, ou Titre"}]}.
N’invente aucune œuvre. Si rien ne correspond, renvoie {"results":[]}.`;
  try {
    const r = await SAMPLE.json(prompt, { modelTier:"quick" });
    if (seq !== suggSeq) return;
    const known = allWorks();
    const items = (r && Array.isArray(r.results) ? r.results : []).filter(it => it && it.ti && (it.t === "manga" || it.t === "anime"))
      .filter(it => !known.some(w => w.t === it.t && (norm(w.ti) === norm(it.ti) || (w.ro && norm(w.ro) === norm(it.ti)) || (w.jp && it.jp && w.jp === it.jp))))
      .slice(0, 6).map(it => ({ ti:String(it.ti), jp:String(it.jp || ""), t:it.t, y:it.y ? String(it.y) : "", by:String(it.by || ""), st:String(it.st || ""), why:String(it.why || "") }));
    state.sugg = { q, items };
  } catch (e) {
    if (seq !== suggSeq) return;
    const c = e && e.code;
    state.sugg = { q, items:[], err: c === "offline" ? "Hors ligne : la recherche étendue reprendra dès que tu seras connecté." : c === "bad_key" ? "Clé API refusée : vérifie-la dans les Réglages." : c === "no_credit" ? "Crédit API épuisé : recharge ton compte sur platform.claude.com." : c === "rate_limited" ? "Trop de recherches d’affilée : attends un instant puis retape ta recherche." : c === "not_granted" ? "Autorise Claude dans les permissions de la page pour chercher au-delà de l’encyclopédie." : "La recherche étendue n’a pas abouti." };
  }
  if (state.view === "catalog") paintSugg();
}

function stepper(w, e, key, label) {
  return `<div><div class="stepper-l">${esc(label)}</div><div class="stepper">
    <button type="button" data-step="-1" data-key="${key}" data-id="${esc(w.id)}" aria-label="Retirer un">−</button>

function rel(t) {
  const d = (now() - t) / 1000;
  if (d < 60) return "à l’instant";
  if (d < 3600) return `il y a ${Math.floor(d / 60)} min`;
  if (d < 86400) return `il y a ${Math.floor(d / 3600)} h`;
  if (d < 86400 * 30) return `il y a ${Math.floor(d / 86400)} j`;
  return new Date(t).toLocaleDateString("fr-FR", { day:"numeric", month:"short", year:"numeric" });
}

/* ───────── entries mutations ───────── */
function entry(id) { return S.entries[id] ? { ...S.entries[id] } : null; }
function setEntry(id, patch, quiet) {
  const w = getWork(id); if (!w) return;
  const prev = S.entries[id];
  const e = Object.assign(prev ? { ...prev } : { status:"plan", added:now(), ch:0, ep:0, vol:0 }, patch, { updated:now() });
  const u = unit(w);
  if (patch.status === "done" && !u.film && u.total && (e[u.key] || 0) < u.total) e[u.key] = u.total;
  if (patch.status === "done" && w.t === "manga" && w.v && (e.vol || 0) < w.v) e.vol = w.v;
  if (patch.status === "done" && !e.end) e.end = today();
  if (patch.status === "current" && !e.start) e.start = today();
  if (patch.status && !prev && !quiet) toast(`« ${w.ti} » ajouté à ${stLabel(patch.status, w.t).toLowerCase() === "en cours" ? "tes lectures en cours" : "ta liste"}.`);
  put("e", id, e);
  softRender();
}
function step(id, key, d) {
  const w = getWork(id); const e = entry(id) || { status:"current" };
  const u = unit(w);
  let n = Math.max(0, (e[key] || 0) + d);
  const patch = { [key]:n };
  if (!S.entries[id] || e.status === "plan") patch.status = "current";
  if (key === u.key && u.total && n >= u.total && e.status !== "done") { patch.status = "done"; toast(`Bravo, « ${w.ti} » est terminé !`); }
  setEntry(id, patch, true);
}
function removeEntry(id) {
  const old = S.entries[id]; if (!old) return;
  const w = getWork(id);
  put("e", id, null); render();
  toast(`« ${w.ti} » retiré de ta liste.`, () => { put("e", id, old); render(); });
}

function fichePrompt(title, jp, type) {

Réponds UNIQUEMENT par un objet JSON avec ces clés :

Si le titre est ambigu, choisis l’œuvre la plus connue de ce type. Si tu n’es pas sûr d’une information, mets null ou une chaîne vide plutôt que d’inventer. Si tu ne connais pas cette œuvre, renvoie {"inconnu": true}.`;

function applyFiche(dr, r) {

let coverTarget = null;

function processImage(file, target) {
  if (!file || !/^image\//.test(file.type)) { toast("Ce fichier n’est pas une image."); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const sq = typeof target === "string" && target.includes("~p");
      const W = sq ? 240 : 420, H = sq ? 240 : 630, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
      cv.getContext("2d").drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      const url = cv.toDataURL("image/jpeg", .82);
      if (target === "draft") { readForm(); draft.cover = url; render(); }
      else { put("c", target, { img:url }); render(); toast(sq ? "Illustration du personnage enregistrée." : "Couverture enregistrée."); }
    };
    im.onerror = () => toast("Cette image n’a pas pu être lue. Essaie de l’enregistrer puis de l’importer.");
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
$("#coverfile").addEventListener("change", e => processImage(e.target.files && e.target.files[0], coverTarget));

document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("tr[data-open]")) go("work", ev.target.dataset.open); });
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if (d.ch === "catsort") { prefs.catSort = t.value; if (t.value === "trend" || t.value === "avg" || t.value === "mine") prefs.catDir = -1; savePrefs(); render(); }
  else if (d.ch === "lsort") { prefs.listSort = t.value; savePrefs(); render(); }
  else if (d.ch === "score") setEntry(d.id, { score:+t.value });
  else if (d.ch === "status") setEntry(d.id, { status:t.value });
  else if (d.ch === "num") { const w = getWork(d.id); const cur = (S.entries[d.id] || {})[d.key] || 0; step(d.id, d.key, Math.max(0, parseInt(t.value || "0", 10)) - cur); }
  else if (d.ch === "date") setEntry(state.id, { [d.key]:t.value || null });
  else if (d.ch === "note") { setEntry(state.id, { note:t.value.slice(0, 5000) }); toast("Notes enregistrées."); }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.dataset.form === "review") {
    const fd = new FormData(f); const s = +fd.get("s"); const txt = String(fd.get("t") || "").trim().slice(0, 1500);
    if (!s) { toast("Choisis une note pour ton avis."); return; }
    putReview(state.id, { s, t:txt, d:new Date().toISOString() });
    if (!S.entries[state.id]) setEntry(state.id, { status:"done", score:s }, true);
    else if (!S.entries[state.id].score) setEntry(state.id, { score:s }, true);
    render(); toast("Merci, ton avis est publié.");
  } else if (f.dataset.form === "work") saveDraft();
});
let qT;
$("#q").addEventListener("input", e => {
  state.cat.q = e.target.value;
  clearTimeout(qT);
  qT = setTimeout(() => { if (state.view !== "catalog") { state.cat.person = ""; go("catalog"); } else render(); }, 140);
  clearTimeout(suggT);
  const q = e.target.value.trim();
  if (false) suggT = setTimeout(() => suggest(q === state.cat.q.trim() ? state.cat.q : q), 900);
});

/* ───────── réglages ───────── */
function vSettings() {
  const upd = S.meta.updated ? new Date(S.meta.updated).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" }) : "jamais";
  const n = Object.keys(S.entries).length, nw = Object.keys(S.works).length, nc = Object.keys(S.covers).length;
  return `
  <div class="view-head"><div><h1>Réglages</h1><p>Tout est enregistré sur ce téléphone. Rien n’est envoyé ailleurs, sauf tes demandes à Claude.</p></div></div>
  <section class="set">
    <h2>Claude</h2>
    <p class="muted">Quand une œuvre manque, FilRouge envoie ta demande à Claude. Une tâche programmée de ton compte Claude la traite toutes les 2 heures (de 8 h à 22 h) : elle cherche l’œuvre sur le web et ajoute sa fiche. C’est inclus dans ton abonnement, sans clé API ni frais en plus.</p>
    <div class="set-row"><span class="set-state ${GH.token && !REQ.err ? "ok" : ""}"><i></i>${!GH.token ? "Demandes non activées" : REQ.err ? "Envoi bloqué : vois le message ci-dessous" : "Jeton enregistré"}</span></div>
    <form class="set-form" data-form="gh" autocomplete="off">
      <label class="field"><span class="label">Jeton GitHub (accès aux demandes uniquement)</span><input class="input" id="ghin" name="gh" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></label>
      <div class="set-btns"><button class="btn primary" type="submit">Enregistrer</button><button class="btn" type="button" data-act="testgh" ${GH.token ? "" : "disabled"}>Tester</button>${GH.token ? `<button class="btn" type="button" data-act="copygh">Copier le jeton</button>` : ""}${GH.token ? `<button class="btn ghost danger" type="button" data-act="rmgh">Retirer</button>` : ""}</div>
    </form>
    <details class="howto"><summary>Créer le jeton, pas à pas (gratuit)</summary><ol>
      <li>Ouvre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com › Fine-grained token</a>, connecté à ton compte.</li>
      <li>Nom : « FilRouge ». Expiration : la plus longue proposée.</li>
      <li><b>Repository access</b> : « Only select repositories », puis choisis <b>Filrouge</b> (et <b>filrouge-perso</b> pour la synchronisation).</li>
      <li><b>Permissions › Repository permissions › Issues</b> : « Read and write » (indispensable pour envoyer les demandes). Pour la synchronisation, mets aussi <b>Contents</b> sur « Read and write ».</li>
      <li>Si tu modifies un jeton existant, touche <b>Update</b> en bas de page : le jeton reste le même, inutile de le recoller.</li>
      <li>Touche <b>Generate token</b>, copie le jeton (il commence par github_pat_), colle-le ci-dessus et touche Enregistrer.</li>
    </ol></details>
    ${S.requests.length ? `<div class="label">Mes demandes</div>${reqStatusHTML()}${requestsHTML()}` : ""}
  </section>
  <section class="set">
    <h2>Synchronisation PC et téléphone</h2>
    <p class="muted">Ta liste, tes notes, tes fiches perso et tes illustrations sont copiées dans ton dépôt GitHub <b>privé</b> filrouge-perso. Chaque appareil où FilRouge a ton jeton les récupère automatiquement.</p>
    <div class="set-row"><span class="set-state ${SYNC.last && !SYNC.err ? "ok" : ""}"><i></i><span id="syncstate">${esc(syncLabel())}</span></span></div>
    <div class="set-btns"><button class="btn" type="button" data-act="syncnow" ${GH.token ? "" : "disabled"}>Synchroniser maintenant</button></div>
    <details class="howto"><summary>Activer la synchronisation (une seule fois)</summary><ol>
      <li>Sur <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a>, crée le dépôt <b>filrouge-perso</b> en <b>Private</b>, avec « Add a README file ».</li>
      <li>Ouvre <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">tes jetons GitHub</a>, puis le jeton « FilRouge » et touche <b>Edit</b>.</li>
      <li>Dans <b>Repository access</b>, ajoute <b>filrouge-perso</b> à côté de Filrouge.</li>
      <li>Dans <b>Repository permissions</b>, mets <b>Contents</b> sur « Read and write » (garde Issues en « Read and write »), puis <b>Update</b>.</li>
      <li>Reviens ici et touche <b>Synchroniser maintenant</b>. Sur l’ordinateur, ouvre FilRouge à la même adresse et colle le même jeton dans les Réglages.</li>
    </ol></details>
  </section>
  <section class="set">
    <h2>Presse, tendances et plateformes</h2>
    <p class="muted">Mis à jour chaque semaine et téléchargés automatiquement quand tu es en ligne. Dernière mise à jour : <b>${esc(upd)}</b>.</p>
    <div class="set-btns"><button class="btn" type="button" data-act="refreshmeta">Actualiser maintenant</button></div>
  </section>
  <section class="set">
    <h2>Mes données</h2>
    <p class="muted">${n} œuvre${n > 1 ? "s" : ""} suivie${n > 1 ? "s" : ""}, ${nw} fiche${nw > 1 ? "s" : ""} perso, ${nc} illustration${nc > 1 ? "s" : ""} importée${nc > 1 ? "s" : ""}.</p>
    <div class="set-btns"><button class="btn" type="button" data-act="export">Exporter une sauvegarde</button><button class="btn" type="button" data-act="importfile">Importer un fichier</button></div>
    <details class="howto"><summary>Transférer ma liste depuis Hondana</summary><ol>
      <li>Ouvre Hondana, va dans <b>Ma liste</b> et touche <b>Transférer vers FilRouge</b> : le transfert est copié.</li>
      <li>Reviens ici, colle-le dans le champ ci-dessous et touche <b>Importer</b>.</li>
    </ol>
    <form data-form="paste"><textarea class="input" name="blob" rows="4" placeholder="Colle ici le transfert Hondana ou une sauvegarde FilRouge"></textarea><div class="set-btns"><button class="btn primary" type="submit">Importer</button></div></form></details>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
  </section>
  <p class="note-ed">FilRouge · version ${APP_VERSION}</p>`;
}
const APP_VERSION = "1.3.2";
function exportData() {
  const data = { app:"filrouge", version:1, exported:new Date().toISOString(), entries:S.entries, works:S.works, covers:S.covers, reviews:S.reviews.me || {} };
  const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `filrouge-sauvegarde-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Sauvegarde enregistrée dans tes téléchargements.");
}
function importData(text) {
  let d;
  try { d = JSON.parse(String(text).trim()); } catch { toast("Ce texte n’est pas une sauvegarde FilRouge ou un transfert Hondana."); return; }
  if (!d || typeof d !== "object" || !(d.entries || d.works)) { toast("Ce fichier ne contient pas de liste à importer."); return; }
  let ne = 0;
  for (const [id, e] of Object.entries(d.entries || {})) { const cur = S.entries[id]; if (!cur || (e.updated || 0) >= (cur.updated || 0)) { S.entries[id] = e; ne++; } }
  Object.assign(S.works, d.works || {});
  Object.assign(S.covers, d.covers || {});
  S.reviews.me = Object.assign({}, S.reviews.me || {}, d.reviews || d.myReviews || {});
  ["entries","works","covers","reviews"].forEach(save);
  syncSoon("lib"); syncSoon("cov");
  toast(`Import terminé : ${ne} œuvre${ne > 1 ? "s" : ""} dans ta liste.`);
  go("list", null, false);
}
async function loadShared() {
  try {
    const r = await fetch("./data/works.json", { cache:"no-cache" });
    if (!r.ok) throw 0;
    const d = await r.json();
    S.shared = d.works || {};
    store.set("shared", d);
    settleRequests(d);
  } catch {}
}
async function loadMeta(manual) {
  loadShared();
  try {
    const r = await fetch("./data/meta.json", { cache:"no-cache" });
    if (!r.ok) throw 0;
    const m = await r.json();
    S.meta = { trends:m.trends || null, stream:m.stream || null, updated:m.updated || "" };
    if (m.press) S.press = m.press;
    store.set("meta", m);
    try { const pr = await fetch("./data/press.json", { cache:"no-cache" }); if (pr.ok) { const pj = await pr.json(); S.press = pj.press || {}; store.set("press", pj); } } catch {}
    if (manual) toast("Données à jour.");
  } catch {
    if (manual) toast(navigator.onLine ? "Impossible de récupérer les données pour le moment." : "Hors ligne : les dernières données restent disponibles.");
  }
  softRender();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "copygh") {
    const show = () => { const inp = $("#ghin"); if (inp) { inp.type = "text"; inp.value = GH.token; inp.focus(); inp.select(); } toast("Copie automatique refusée : le jeton est affiché dans le champ, sélectionne-le et copie-le."); };
    try { navigator.clipboard.writeText(GH.token).then(() => toast("Jeton copié : colle-le dans FilRouge sur ton autre appareil."), show); } catch { show(); }
    return;
  }
  if (act === "rmgh") { setToken(""); toast("Jeton retiré de ce téléphone."); render(); }
  else if (act === "export") exportData();
  else if (act === "importfile") $("#importfile").click();
  else if (act === "refreshmeta") loadMeta(true);
  else if (act === "syncnow") syncNow(true);
  else if (act === "flush") flushQueue(true);
  else if (act === "testgh") {
    t.disabled = true; t.textContent = "Test en cours…";
    /* un envoi vide : GitHub répond 422 si le jeton a le droit d’écrire, 403/404 sinon. Aucune demande n’est créée. */
    ghFetch("/issues", { method:"POST", body:"{}" })
      .then(() => toast("Réponse inattendue de GitHub : réessaie."))
      .catch(e => {
        if (e.status === 422) { REQ.err = ""; REQ.waitUntil = 0; const nq = S.requests.filter(x => x.status === "queued").length; toast(nq ? `Le jeton fonctionne : envoi de tes ${nq} demande${nq > 1 ? "s" : ""} en attente…` : "Le jeton fonctionne : il peut envoyer tes demandes à Claude."); if (nq) setTimeout(() => flushQueue(true), 1500); else render(); }
        else { REQ.err = ghErrText(e); toast(REQ.err); paintReq(); }
      })
      .finally(() => { t.disabled = false; t.textContent = "Tester"; });
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "importfile") {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => importData(rd.result); rd.readAsText(f);
    ev.target.value = "";
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target;
  if (f.dataset.form === "gh") {
    ev.preventDefault();
    const k = String(new FormData(f).get("gh") || "").trim();
    if (!/^(github_pat_|ghp_)/.test(k)) { toast("Un jeton GitHub commence par « github_pat_ ». Vérifie le copier-coller."); return; }
    setToken(k); toast("Jeton enregistré sur cet appareil. Touche Tester pour vérifier."); render(); flushQueue(); syncNow();
  } else if (f.dataset.form === "paste") {
    ev.preventDefault();
    importData(new FormData(f).get("blob"));
  }
}, true);
addEventListener("online", () => { renderNav(); loadMeta(); flushQueue(); syncNow(); });
addEventListener("offline", renderNav);

/* ───────── démarrage ───────── */
async function boot() {
  const [e, w, c, r, m, sh, rq, dl, pr] = await Promise.all(["entries","works","covers","reviews","meta","shared","requests","del","press"].map(k => store.get(k)));
  S.del = Object.assign({ e:{}, w:{}, c:{}, r:{} }, dl || {});
  S.shared = (sh && sh.works) || {}; S.requests = Array.isArray(rq) ? rq : [];
  S.entries = e || {}; S.works = w || {}; S.covers = c || {}; S.reviews.me = r || {};
  if (m) { S.meta = { trends:m.trends || null, stream:m.stream || null, updated:m.updated || "" }; S.press = m.press || {}; }
  if (pr && pr.press) S.press = pr.press;
  try { history.replaceState(navState(), ""); } catch {}
  render();
  loadMeta();
  flushQueue();
  syncNow();
  if ("serviceWorker" in navigator) {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("./sw.js");
      reg.update && reg.update();
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController || reloaded) return; reloaded = true; if (!typing()) location.reload(); });
    } catch {}
  }
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch {} }
}
boot();
})();
</script>
